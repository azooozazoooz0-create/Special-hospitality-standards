    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.8); transform: scale(1); }
      70% { box-shadow: 0 0 0 4px rgba(234, 179, 8, 0); transform: scale(1.02); }
      100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); transform: scale(1); }

    /* تصغير الدبابيس لتكون صغيرة جداً ومثالية على الجوال واللابتوب */

    }
    .custom-pin span {
      font-size: 8px !important;

  <script>
    /* المعايير العامة والخدمات (الشقة) */
    const apartmentGeneralStandards = [
      "أن يكون العقار مناسباً لاستقبال الضيوف (لا يكون على سبيل المثال غرفة سائق أو مبنى سكن عمالة).",
      "تركيب كاميرات مراقبة تعمل بكفاءة تغطي جميع المداخل الرئيسية للمبنى، تعمل على مدار الساعة لضمان أمن الضيوف والوحدة. ويشترط أن تكون الكاميرات بدقة تصوير واضحة ومطابقة للاشتراطات الأمنية والأنظمة المعتمدة لحماية الخصوصية، مع توفير وحدة تسجيل تحفظ المقاطع للمدة النظامية المقررة.",
      "توفير إضاءة كافية وموزعة بشكل مناسب في المدخل الرئيسي والممرات والسلالم لضمان وضوح الرؤية وسلامة الحركة، تعمل بكفاءة طوال فترة الإقامة. ويشترط أن تكون وحدات الإضاءة سليمة ومطابقة لاشتراطات السلامة الكهربائية.",
      "توفير موقف مخصص لسيارة واحدة على الأقل، متاحاً للضيف طوال مدة إقامتهم. ويشترط أن يكون الموقف بمساحة كافية وواضح التحديد وآمناً وسهل الوصول إليه كموقف للوحدة.",
      "توفير مصعد بالمبنى يعمل بكفاءة يخدم جميع الطوابق ابتداءً من الطابق الأرضي، وذلك إذا كان المبنى يتكون من ثلاثة طوابق أو أكثر. ويشترط أن يكون المصعد مطابقاً لاشتراطات السلامة المعتمدة، وحاصلاً على شهادة فحص سارية من الجهات المختصة، ومزوداً بأنظمة الإنذار والإضاءة الاحتياطية وزر الطوارئ.",
      "أن تكون قائمة الأسعار باللغتين العربية والانجليزية داخل الوحدة للخدمات الإضافية المدفوعة (مطبوع أو باركود) - إن وجدت",
      "التزام الوحدة بأن تكون الأرضيات والجدران مغطاة بتشطيب مناسب وكامل وبحالة جيدة، سليم ومثبت بإحكام وخال من التشققات والكسور والتقشر والفراغات وآثار الرطوبة والعفن، بحيث يغطي كامل الأسطح دون أجزاء مكشوفة أو غير مكتملة، ويكون قابلاً للتنظيف والصيانة.",
      "أن يتم إبراز الإرشادات العامة لضوابط استخدام الوحدة في مكان ظاهر داخل وحدة الضيافة وتشمل على سبيل المثال لا الحصر:(استخدام مواقف السيارات، إخراج النفايات، أماكن تعليمات استخدام الأجهزة، السلوكيات المحظورة، والتعامل مع المفقودات، ورقم خدمة العملاء والهاتف السياحي والطوارئ، ونحو ذلك).",
      "توفير نظام دخول آمن لكل وحدة يتيح للضيف غلقها وفتحها بإحكام، يعمل بكفاءة وبحالة جيدة، ويضمن خصوصية الوحدة وعدم إمكانية فتحها من غير الضيف المخول أو إدارة الوحدة عند الحاجة النظامية لذلك",
      "توفير أدوات ومستلزمات التنظيف اللازمة للوحدة بجميع مكوناتها من غرف ودورات مياه ومطبخ، بحيث تكون كاملة وصالحة للاستخدام وبحالة جيدة، وتشمل أدوات تنظيف الأرضيات والأسطح ودورات المياه والمطبخ ومواد التنظيف الأساسية وحاويات النفايات، وتحفظ بعيداً عن متناول الأطفال.",
      "توفير ستائر أو وسيلة تعتيم لجميع نوافذ الوحدة، تغطيها بالكامل وتحجب الرؤية والضوء الخارجي بفعالية، وتكون مثبتة بإحكام وبحالة جيدة وصالحة للاستخدام",
      "توفير سلال مهملات في غرف المعيشة وجميع الغرف، تكون مناسبة الحجم وبحالة جيدة وقابلة للتنظيف ومزودة بأكياس، مع توفير عدد كاف من الأكياس البديلة",
      "توفير مكواة كهربائية وطاولة كي أو كواية بخار لكل وحدة، تعملان بكفاءة وبحالة جيدة وصالحين للاستخدام",
      "توفير عين سحرية أو كاميرا باب لكل وحدة تتيح للضيف رؤية الخارج قبل فتح الباب، تكون واضحة الرؤية وبحالة جيدة",
      "أن يوضع رمز الاستجابة السريع (QR) الخاص ببرنامج روح السعودية في مكان ظاهر وواضح داخل كل وحدة، يكون سليماً وقابلاً للمسح والعمل بكفاءة",
      "توفير سجادة صلاة نظيفة وبحالة جيدة لكل وحدة، مع توضيح اتجاه القبلة بعلامة ظاهرة على السقف، تكون واضحة وصحيحة الاتجاه.",
      "توفير خدمة الإنترنت اللاسلكي (Wi-Fi) في كل وحدة، تعمل بكفاءة وبتغطية تشمل كامل الوحدة وبسرعة مناسبة للاستخدام، مع تزويد الضيف ببيانات الدخول."
    ];

      "أن تكون قائمة الأسعار باللغتين العربية والانجليزية داخل الوحدة للخدمات الإضافية المدفوعة (مطبوع أو باركود) - إن وجدت",

    function switchCategory(type) {

    function openModal(title, items) {
      document.getElementById('modalTitle').innerText = title;
      const listContainer = document.getElementById('modalList');
      listContainer.innerHTML = '';
      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'flex items-start gap-2 bg-slate-900/70 p-2.5 md:p-3.5 rounded-xl border border-slate-700/50';
        li.innerHTML = `<span class="text-amber-400 font-black mt-0.5">${index + 1}.</span> <span class="leading-relaxed text-slate-200">${item}</span>`;
        listContainer.appendChild(li);
      });
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>

</body>
</html>
